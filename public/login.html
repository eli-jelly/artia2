<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!--css links-->
    <link rel="stylesheet" href="style_sheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  
    <title>login</title>
</head>
<body>
    <div class="login-background d-flex justify-content-center align-items-center text-center p-4">
        <a href="connect.html" class="back-button">← BACK</a>
        <div class="clear-card">
            <h1 class="login-header">Login</h1>
            <form id="loginForm">
                <div class="login-row d-flex flex-column flex-md-row justify-content-center align-items-center gap-2 mt-4">
                    <input type="email" placeholder="Email address" id="email" class="login-email form-control" required>
                    <div class="password-container">
                        <input type="password" placeholder="Password" id="password" class="login-password form-control" required minlength="6" pattern="\S+" title="Password must be at least 6 charecters and cannot contain spaces">
                        <i class="fa-solid fa-eye" style="color: #46462a;" id="togglePassword"></i>
                    </div>
                    <p id="passwordHint" class="password-hint"></p>
                    <button type="submit" class="login-submit">Login</button>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="login.js"></script>

</body>
</html>
